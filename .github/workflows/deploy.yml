# Push to main, and the box has it about a minute later.
#
# The build runs on the server rather than here so that what ships is what the
# server can actually build: a bundle built on a runner with a different Node
# and copied across hides a version mismatch until the next cold start.
name: Deploy

on:
  push:
    branches: [main]
  # For redeploying without an empty commit.
  workflow_dispatch:

concurrency:
  # A second push while one deploy is mid-build would race it onto the same
  # working tree. Queue instead, and never cancel a deploy already running --
  # cancelling one between `git reset` and `npm run build` leaves the box on a
  # half-updated checkout.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # The script is the deploy: keeping the steps on the box means a
          # hand-run deploy and an automated one are the same thing.
          # The repository migrated from pnpm to npm. Older production boxes can
          # still carry the pre-migration frozen-lockfile command, so normalize it
          # in place before running the otherwise unchanged server-side deploy.
          script: |
            sudo -u joi-site sed -i 's/pnpm install --frozen-lockfile/npm install --no-audit --no-fund/' /opt/joi-site/deploy-site.sh
            sudo -u joi-site /opt/joi-site/deploy-site.sh
