<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The site's brand mark, shrunk to a tab.

    `.brand` in joi-signal-lab.module.css is italic serif with a chromatic split —
    coral 1.5px left, blue 1.5px right, over the CRT's near-black. The same three
    colours are reused here so the tab reads as the same object as the header.
  -->
  <rect width="32" height="32" rx="7" fill="#05070b"/>
  <rect x="2" y="2" width="28" height="28" rx="5.5" fill="#0a1221"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" font-weight="400" text-anchor="middle">
    <text x="14.7" y="24" fill="#ec6549">G</text>
    <text x="17.3" y="24" fill="#6592bd">G</text>
    <text x="16" y="24" fill="#f2eee8">G</text>
  </g>
</svg>
